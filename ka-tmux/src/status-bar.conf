#+----------------+
#+ Plugin Support +
#+----------------+
#+--- tmux-prefix-highlight ---+
set -g @prefix_highlight_output_prefix "#[fg=brightcyan]#[bg=black]#[nobold]#[noitalics]#[nounderscore]#[bg=brightcyan]#[fg=black]"
set -g @prefix_highlight_output_suffix ""
set -g @prefix_highlight_copy_mode_attr "fg=brightcyan,bg=black,bold"

#+--------+
#+ Status +
#+--------+
set -g status-interval 2
# Perpanjang limit panjang status bar agar teks tidak terpotong
set -g status-left-length 60
set -g status-right-length 150
# Status bar Left
set -g status-left "#[fg=black,bg=blue,bold] #{=10:session_name} #[fg=black,bg=blue,nobold](#{session_windows}w)#{?client_prefix,#[fg=yellow] 󰌌,  }#{?window_zoomed_flag,#[fg=brightcyan] 🔍,  } #[fg=blue,bg=black,nobold,noitalics,nounderscore]"
# Status bar Right
set -g status-right "#{prefix_highlight}#[fg=red,bg=black,nobold,noitalics,nounderscore]#[fg=#000000,bg=brightblack] #(/bin/bash /Users/i/work/KAnggara75/.gemini/antigravity-cli/title.sh #{pane_id}) #[fg=#000000,bg=brightblack,nobold,noitalics,nounderscore]#[fg=#000000,bg=brightblack] ${KA_DATE_FORMAT} #[fg=#000000,bg=brightblack,nobold,noitalics,nounderscore]#[fg=#000000,bg=brightblack] ${KA_TIME_FORMAT} #[fg=red,bg=brightblack,nobold,noitalics,nounderscore]#[fg=#000000,bg=cyan,bold] #h"

#+--- Windows ---+
set -g window-status-format "#[fg=#000000,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,noitalics,nounderscore] #[fg=white,bg=brightblack,nobold]#{?#{m/r:^$HOME$,#{pane_current_path}},home,#{b:pane_current_path}} #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=#000000,bg=cyan,nobold,noitalics,nounderscore] #[fg=#000000,bg=cyan,bold]#I #[fg=#000000,bg=cyan,nobold,noitalics,nounderscore] #[fg=#000000,bg=cyan]#{?#{m/r:^$HOME$,#{pane_current_path}},~,#{b:pane_current_path}}  #{pane_current_command} #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
