## Change Prefix Ctrl+b => Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes
unbind l
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D

#+--- Windows ---+
set -g visual-bell off
set -g bell-action none
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"

# Resize pane using Alt-arrow without prefix
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# Enable mouse mode (tmux 2.1 and above) control (clickable windows, panes, resizable panes)
set -g mouse on
set -g history-limit 100000

# don't rename windows automatically
set-option -g allow-rename off

# Escape time
set-option -sg escape-time 10

# enable focus event
set-option -g focus-events on

# -- display -------------------------------------------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed
set -g extended-keys on
set -g extended-keys-format csi-u

## Terminal Colors, TrueColor (RGB), dan Ghostty Features
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",xterm-ghostty:RGB:extkeys:sync:clipboard"
set-option -ga terminal-features ",tmux-256color:RGB:extkeys:sync:clipboard"
set-option -ga terminal-overrides ",xterm-ghostty:RGB"
set-option -ga terminal-overrides ",screen-256color:RGB"

## Meneruskan escape sequences ke terminal (Penting untuk Kitty Graphics Protocol / image preview di yazi, neovim, viu, dll.)
set-option -g allow-passthrough on

## Sinkronisasi clipboard sistem via OSC 52
set-option -g set-clipboard on

# if run as "tmux attach", create a session if one does not already exist
new-session -n $HOST

# List of plugins

# set -g @plugin 'tmux-plugins/tpm'

# Manual Install Nord theme
run-shell "~/.tmux/themes/ka-tmux/kanggara.tmux"

